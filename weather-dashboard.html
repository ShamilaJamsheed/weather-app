<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Weather Dashboard 2025</title>

<style>
  * {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
    font-family: "Poppins", sans-serif;
  }

  body {
    height: 100vh;
    width: 100vw;
    display: flex;
    justify-content: center;
    align-items: center;
    background: radial-gradient(circle at top, #1a1c2e, #0b0d18 70%);
    color: #fff;
    overflow: hidden;
  }

  .app {
    width: 90%;
    max-width: 420px;
    text-align: center;
    display: flex;
    flex-direction: column;
    align-items: center;
  }

  .year-badge {
    background: linear-gradient(90deg, #00c6ff, #0072ff);
    border-radius: 20px;
    padding: 5px 15px;
    font-weight: bold;
    font-size: 0.9rem;
    margin-bottom: 10px;
  }

  .search-box {
    display: flex;
    width: 100%;
    justify-content: center;
    gap: 0.5rem;
    margin-bottom: 20px;
  }

  .search-box input {
    background: rgba(255, 255, 255, 0.15);
    border: none;
    border-radius: 20px;
    padding: 10px 15px;
    color: #fff;
    width: 70%;
    outline: none;
  }

  .search-box button {
    background: #0072ff;
    border: none;
    border-radius: 20px;
    padding: 10px 15px;
    color: white;
    cursor: pointer;
    transition: 0.3s;
  }

  .search-box button:hover {
    background: #00c6ff;
  }

  .current-weather {
    text-align: center;
    margin-bottom: 25px;
  }

  .current-weather img {
    width: 100px;
    height: 100px;
  }

  .temperature {
    font-size: 4rem;
    font-weight: 700;
    line-height: 1;
  }

  .desc {
    text-transform: capitalize;
    font-size: 1.1rem;
    opacity: 0.8;
  }

  .location {
    font-size: 1rem;
    opacity: 0.8;
    margin-top: 5px;
  }

  .hourly {
    display: flex;
    overflow-x: auto;
    gap: 10px;
    margin: 20px 0;
    padding-bottom: 10px;
    scrollbar-width: thin;
  }

  .hour-card {
    flex: 0 0 auto;
    background: rgba(255, 255, 255, 0.1);
    backdrop-filter: blur(15px);
    border-radius: 15px;
    padding: 10px;
    min-width: 70px;
    text-align: center;
  }

  .hour-card img {
    width: 40px;
    height: 40px;
  }

  .forecast {
    display: flex;
    justify-content: space-around;
    flex-wrap: wrap;
    gap: 10px;
    margin-top: 10px;
  }

  .day-card {
    background: rgba(255, 255, 255, 0.1);
    border-radius: 15px;
    width: 90px;
    padding: 10px;
    text-align: center;
    backdrop-filter: blur(10px);
  }

  .day-card img {
    width: 40px;
    height: 40px;
  }

  .day {
    font-weight: bold;
    margin-top: 3px;
  }

  .forecast-temp {
    font-size: 0.9rem;
    opacity: 0.8;
  }

  .footer {
    margin-top: 20px;
    font-size: 0.8rem;
    opacity: 0.6;
  }
</style>
</head>

<body>
  <div class="app">
    <div class="year-badge">2025</div>

    <div class="search-box">
      <input type="text" id="city" placeholder="Enter city..." />
      <button onclick="getWeather()">Search</button>
    </div>

    <div class="current-weather">
      <img id="icon" src="" alt="Weather Icon" />
      <div class="temperature" id="temp">--°C</div>
      <div class="desc" id="desc">---</div>
      <div class="location" id="location">Search for a city</div>
    </div>

    <div class="hourly" id="hourly"></div>

    <div class="forecast" id="forecast"></div>

    <div class="footer">Powered by OpenWeatherMap</div>
  </div>

  <script>
    const API_KEY = "c3a241e2c0963ffe34e4343402f08745";

    async function getWeather() {
      const city = document.getElementById("city").value.trim();
      if (!city) return alert("Enter a city name");

      try {
        const geo = await fetch(
          `https://api.openweathermap.org/geo/1.0/direct?q=${city}&limit=1&appid=${API_KEY}`
        );
        const geoData = await geo.json();
        if (!geoData.length) return alert("City not found!");

        const { lat, lon, name, country } = geoData[0];

        const res = await fetch(
          `https://api.openweathermap.org/data/2.5/forecast?lat=${lat}&lon=${lon}&units=metric&appid=${API_KEY}`
        );
        const data = await res.json();

        const current = data.list[0];
        document.getElementById("temp").textContent =
          Math.round(current.main.temp) + "°C";
        document.getElementById("desc").textContent =
          current.weather[0].description;
        document.getElementById("icon").src = `https://openweathermap.org/img/wn/${current.weather[0].icon}@2x.png`;
        document.getElementById("location").textContent = `${name}, ${country}`;

        // Hourly Forecast (next 8 entries ~ 24hrs)
        const hourlyContainer = document.getElementById("hourly");
        hourlyContainer.innerHTML = "";
        data.list.slice(0, 8).forEach((hour) => {
          const time = new Date(hour.dt * 1000).toLocaleTimeString("en-US", {
            hour: "numeric",
          });
          hourlyContainer.innerHTML += `
            <div class="hour-card">
              <div>${time}</div>
              <img src="https://openweathermap.org/img/wn/${hour.weather[0].icon}.png">
              <div>${Math.round(hour.main.temp)}°C</div>
            </div>
          `;
        });

        // 4-Day Forecast
        const days = {};
        data.list.forEach((item) => {
          const date = new Date(item.dt * 1000);
          const dayName = date.toLocaleDateString("en-US", { weekday: "short" });
          if (!days[dayName]) days[dayName] = item;
        });

        const forecastContainer = document.getElementById("forecast");
        forecastContainer.innerHTML = "";

        Object.keys(days)
          .slice(1, 5)
          .forEach((day) => {
            const item = days[day];
            forecastContainer.innerHTML += `
              <div class="day-card">
                <div class="day">${day}</div>
                <img src="https://openweathermap.org/img/wn/${item.weather[0].icon}.png">
                <div class="forecast-temp">${Math.round(item.main.temp)}°C</div>
              </div>
            `;
          });
      } catch (err) {
        console.error("Weather fetch error", err);
        alert("Failed to fetch weather data.");
      }
    }
  </script>
</body>
</html>
